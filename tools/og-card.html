<!doctype html>
<!-- The link preview image (og-image.png), rendered by build.mjs at 1200x630.

<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body { background: #0b0d10; color: #e8edf2; font-family: Inter, sans-serif; display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: center; padding: 72px 76px; position: relative; overflow: hidden; }
  body::before { content: ""; position: absolute; inset: 0; background: radial-gradient(800px 420px at 85% 10%, rgba(61,220,151,.14), transparent 60%); }
  .eyebrow { font: 500 22px "JetBrains Mono", monospace; color: #3ddc97; }
  h1 { font: 700 104px/0.95 "Space Grotesk", sans-serif; letter-spacing: -0.035em; margin-top: 18px; }
  .role { font: 600 32px "Space Grotesk", sans-serif; color: #8b96a3; margin-top: 18px; }
  .url { font: 500 24px "JetBrains Mono", monospace; color: #c9d3dd; margin-top: 44px; display: flex; align-items: center; gap: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #3ddc97; box-shadow: 0 0 0 5px rgba(61,220,151,.15); }
  .term { position: relative; background: #070809; border: 1px solid #1f2630; border-radius: 18px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid #1f2630; font: 18px "JetBrains Mono", monospace; color: #8b96a3; }
  .bar i { width: 13px; height: 13px; border-radius: 50%; background: #2a323d; }
  .bar .pass { margin-left: auto; color: #3ddc97; }
  pre { padding: 22px 22px 26px; font: 19px/1.75 "JetBrains Mono", monospace; color: #c9d3dd; white-space: pre-wrap; }
  .c { color: #6b7685; } .ok { color: #3ddc97; } .k { color: #7cc4ff; } .b { color: #fff; font-weight: 700; }
</style>
</head>
<body>

    <div class="eyebrow">// Porto, Portugal</div>

<span class="ok b">5 passed</span></pre>
  </div>
</body>
</html>
